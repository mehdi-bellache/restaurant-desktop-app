<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="kitchenReceipt.css">
    <title>kitchenReceipt</title>
</head>
<body>
    <div class="kitchen-receipt">
        <div class="receipt-info">
            <h3 class="receipt-title">KITCHEN - PREPARATION</h3>
            <p class="receipt-table">TABLE 4 (6 PLATES)</p>
            <div class="receipt-details">
                <span class="receipt-detail-time">12 Novembre 2026 - 1:33 PM</span>
                <span class="receipt-detail-waiter">WAITER : JEAN LUC</span>
            </div>
        </div>
        <div class="kitchen-receipt-order">
            <div class="kitchen-order-item">
                <span class="order-item-quantity">3x</span>
                <span class="order-item-name">SOUPE DU JOUR</span>
            </div>
            <div class="kitchen-order-item">
                <span class="order-item-quantity">1x</span>
                <span class="order-item-name">SOUPE DU JOUR</span>
            </div>
            <div class="kitchen-order-item">
                <span class="order-item-quantity">1x</span>
                <span class="order-item-name">FOUR CHEESE PIZZA</span>
            </div>
        
            <div class="kitchen-order-item">
                <span class="order-item-quantity">1x</span>
                <span class="order-item-name">COCA-COLA</span>
            </div>
        
            <div class="kitchen-order-item">
                <span class="order-item-quantity">4x</span>
                <span class="order-item-name">CAFE-GOURMAND</span>
            </div>
        </div>
    </div>
    
</body>
</html>
