<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="kitchenReceipt.css">
    <title>kitchenReceipt</title>
</head>
<body>
    <div class="kitchen-ticket">
        <div class="kitchen-ticket-header">
            <h3 class="kitchen-ticket-title">KITCHEN - PREPARATION</h3>
            <p class="kitchen-ticket-table">TABLE 4 (6 COVERS)</p>
            <div class="kitchen-ticket-meta">
                <span class="kitchen-ticket-time">12 Nov 2026 - 1:33 PM</span>
                <span class="kitchen-ticket-waiter">WAITER : JEAN LUC</span>
            </div>
        </div>
        <div class="kitchen-ticket-items">
            <div class="kitchen-ticket-item">
                <span class="ticket-item-quantity">3x</span>
                <span class="ticket-item-name">SOUPE DU JOUR</span>
            </div>
            <div class="kitchen-ticket-item">
                <span class="ticket-item-quantity">1x</span>
                <span class="kitchen-ticket-name">FOUR CHEESE PIZZA</span>
            </div>
        
            <div class="kitchen-ticket-item">
                <span class="ticket-item-quantity">1x</span>
                <span class="ticket-item-name">COCA-COLA</span>
            </div>
        
            <div class="kitchen-ticket-item">
                <span class="ticket-item-quantity">4x</span>
                <span class="ticket-item-name">CAFE-GOURMAND</span>
            </div>
        </div>
    </div>
    
</body>
</html>
