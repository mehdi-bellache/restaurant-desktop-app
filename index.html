<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Restaurant App</title>
</head>
<body>
    <div class="project">
        <div class="firstPart">
            <h1>Restaurant</h1>
            <div class="categories">
                <button class="category-btn js-category-btn">Menu</button>
                <button class="category-btn js-category-btn">Appetizers</button>
                <button class="category-btn js-category-btn">Main Dishes</button>
                <button class="category-btn js-category-btn">Pizzas</button>
                <button class="category-btn js-category-btn">Burgers</button>
                <button class="category-btn js-category-btn">Drinks</button>
                <button class="category-btn js-category-btn">Desserts</button>
                <button class="category-btn js-category-btn">Today's Menu</button>
            </div>
            <div class="boxes"></div>
        </div>
        <div class="order">
            <h2 class="order-title">Order in progress</h2>
            <hr class="order-divider">

            <div class="order-items">
                <div class="order-item">
                    <div class="order-item-quantity">
                        <button class="order-item-btn order-item-minus">-</button>
                        <span class="order-item-count">2x</span>
                        <button class="order-item-btn order-item-plus">+</button>
                    </div>
                    <span class="order-item-name">Four cheese pizza</span>
                    <span class="order-item-price">9.99 $</span>
                </div>
                <div class="order-item">
                    <div class="order-item-quantity">
                        <button class="order-item-btn order-item-minus">-</button>
                        <span class="order-item-count">2x</span>
                        <button class="order-item-btn order-item-plus">+</button>
                    </div>
                    <span class="order-item-name">Four cheese pizza</span>
                    <span class="order-item-price">9.99 $</span>
                </div>
                <div class="order-item">
                    <div class="order-item-quantity">
                        <button class="order-item-btn order-item-minus">-</button>
                        <span class="order-item-count">2x</span>
                        <button class="order-item-btn order-item-plus">+</button>
                    </div>
                    <span class="order-item-name">Four cheese pizza</span>
                    <span class="order-item-price">9.99 $</span>
                </div>
            </div>

            <hr class="order-divider">

            <div class="order-summary">
                <div class="order-vat">
                    <span class="order-vat-name">VAT (5.5%) :</span>
                    <span class="order-vat-price">1.99 $</span>
                </div>
                <div class="order-total">
                    <span class="order-total-name">Total TTC :</span>
                    <span class="order-total-price">11.99 $</span>
                </div>
            </div>

            <div class="order-actions">
                <button class="order-btn order-kitchen">Send to the kitchen</button>
                <button class="order-btn order-pay">Pay</button>
            </div>
        </div>
    </div>

    

    <script src="./scripts/index.js" type="module"></script>
</body>
</html>
