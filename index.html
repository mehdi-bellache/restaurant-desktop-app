<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Restaurant App</title>
</head>
<body>
    <!-- -un boutton est generalement concu pour les formulaires. -->
    <h1>Restaurant</h1>
    <div class="categories">
        <button class="category-btn js-category-btn">Menu</button>
        <button class="category-btn js-category-btn">Appetizers</button>
        <button class="category-btn js-category-btn">Main Dishes</button>
        <button class="category-btn js-category-btn">Desserts</button>
        <button class="category-btn js-category-btn">Drinks</button>
        <button class="category-btn js-category-btn">Today's Menu</button>
    </div>
    <div class="boxes">
        <div class="box">
            <img src="images/coca-cola.jpg" alt="Coca Cola">
            <h5>Coca Cola</h5>
            <span>2.99 €</span>
        </div>
        <div class="box">
            <img src="images/pepsi.jpg" alt="Pepsi">
            <h5>Pepsi</h5>
            <span>2.99 €</span>
        </div>
        <div class="box">
            <img src="images/four-cheese-pizza.jpg" alt="coca-cola">
            <h5>Four Cheese Pizza</h5>
            <span>12.99 €</span>
        </div>
        <div class="box">
            <img src="images/chicken-burger.jpg" alt="Chicken Burger">
            <h5>Chicken Burger</h5>
            <span>9.99 €</span>
        </div>
        <div class="box">
            <img src="images/pizza-margherita.jpg" alt="">
            <h5>Margherita Pizza</h5>
            <span>7.99 €</span>
        </div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
