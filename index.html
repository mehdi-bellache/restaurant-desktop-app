<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="index.css">
    <title>Restaurant App</title>
</head>
<body>
    <div class="project">
        <div class="firstPart">
            <h1>Restaurant</h1>
            <div class="categories">
                <button class="category-btn js-category-btn">Menu</button>
                <button class="category-btn js-category-btn">Appetizers</button>
                <button class="category-btn js-category-btn">Main Dishes</button>
                <button class="category-btn js-category-btn">Pizzas</button>
                <button class="category-btn js-category-btn">Burgers</button>
                <button class="category-btn js-category-btn">Drinks</button>
                <button class="category-btn js-category-btn">Desserts</button>
                <button class="category-btn js-category-btn">Today's Menu</button>
            </div>
            <div class="boxes"></div>
        </div>
        <div class="order">
            <h2 class="order-title">Order in progress</h2>
            <hr class="order-divider">

            <div class="order-items js-order-items"></div>

            <hr class="order-divider">

            <div class="order-summary">
                <div class="order-ht">
                     <span class="order-ht-name">Total HT :</span>
                     <span class="order-ht-price js-order-ht-price"></span>
                </div>
                <div class="order-vat">
                    <span class="order-vat-name">VAT (5.5%) :</span>
                    <span class="order-vat-price js-order-vat-price"></span>
                </div>
                <hr class="order-divider">
                <div class="order-total">
                    <span class="order-total-name">Total TTC :</span>
                    <span class="order-total-price js-order-total-price"></span>
                </div>
            </div>

            <div class="order-actions">
                <button class="order-btn order-kitchen">Send to the kitchen</button>
                <button class="order-btn order-pay">Pay</button>
            </div>
        </div>
    </div>

    

    <script src="./dashboard/scripts/index.js" type="module"></script>
</body>
</html>
