<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Restaurant App</title>
</head>
<body>
    <h1>Restaurant</h1>
    <div class="menu">
        <button>Tous</button>
        <button>Entrees</button>
        <button>Plats</button>
        <button>Desserts</button>
        <button>Boissons</button>
    </div>
    <div class="boxes">
        <div class="box">
            <img src="images/coca-cola.jpg" alt="Coca Cola">
            <h5>Coca Cola</h5>
            <span>2.99 €</span>
        </div>
        <div class="box">
            <img src="images/pepsi.jpg" alt="Pepsi">
            <h5>Pepsi</h5>
            <span>2.99 €</span>
        </div>
        <div class="box">
            <img src="images/four-cheese-pizza.jpg" alt="coca-cola">
            <h5>Four Cheese Pizza</h5>
            <span>12.99 €</span>
        </div>
        <div class="box">
            <img src="images/chicken-burger.jpg" alt="Chicken Burger">
            <h5>Chicken Burger</h5>
            <span>9.99 €</span>
        </div>
        <div class="box">
            <img src="images/pizza-margherita.jpg" alt="">
            <h5>Margherita Pizza</h5>
            <span>7.99 €</span>
        </div>
    </div>

    <script> require('./index.js');</script>
</body>
</html>
